[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flexmix-hub"
version = "0.0.0"
description = "FlexMix Hub development foundation (Phase 00)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
    "SQLAlchemy==2.0.54",
    "PyMySQL[rsa]==1.2.0",
    "cryptography==50.0.1",
    "argon2-cffi==25.1.0",
    "alembic==1.20.0",
    "Jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flexmix_hub = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the explicitly configured development MySQL database"]
