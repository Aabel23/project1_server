<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập · FlexMix Hub</title><link rel="stylesheet" href="{{ url_for('static', path='/dashboard.css') }}"></head>
<body class="login-page"><main class="login-card"><div class="brand brand-login"><span class="brand-mark">F</span><span>FlexMix <strong>Hub</strong></span></div><div class="login-heading"><div class="eyebrow">BẢNG ĐIỀU KHIỂN VẬN HÀNH</div><h1>Chào mừng trở lại</h1><p>Đăng nhập để xem hệ thống máy và hoạt động hệ thống.</p></div><form method="post" action="/login"><label for="username">Tên đăng nhập</label><div class="token-field"><input id="username" name="username" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập" required autofocus></div><label for="password" style="margin-top:14px">Mật khẩu</label><div class="token-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><button class="toggle-token" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" onclick="const input=document.getElementById('password'); const show=input.type==='password'; input.type=show?'text':'password'; this.textContent=show?'Ẩn':'Hiện'; this.setAttribute('aria-pressed',String(show)); this.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');">Hiện</button></div><button class="button button-primary login-submit" type="submit">Đăng nhập</button></form><p class="prototype-note"><span aria-hidden="true">ⓘ</span> Hệ thống thử nghiệm phục vụ phát triển và kiểm thử.</p></main></body></html>
